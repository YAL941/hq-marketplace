version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-hq_marketplace}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
    container_name: hq-marketplace
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-hq_marketplace}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      APP_DB_USER: ${APP_DB_USER:-hq_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me-please}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    volumes:
      - uploads-data:/app/uploads

volumes:
  postgres-data:
  uploads-data:
