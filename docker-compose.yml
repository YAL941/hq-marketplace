services:
  postgres:
    image: postgres:16-alpine
    container_name: hq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-hq_marketplace}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports:
      # Loopback only. "5432:5432" would publish the database on every network
      # interface of the host, with a known default password.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-hq_marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: hq-marketplace
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-hq_marketplace}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-hq_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN (https origin of the site) in .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Production refuses a relative upload directory.
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - uploads-data:/app/uploads

volumes:
  postgres-data:
  uploads-data:
